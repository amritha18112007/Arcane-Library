<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/doors.css">
    <title>Arcane Library</title>
</head>

<body>
    <main class="doors">
        <h1>Arcane Library</h1> 
        <div class="door-frame" id="open-door">
            <div class="top-star">✦</div>
            <div class="door-inner">
                <div class="door-reveal">
                    <a href="Presentation.html" class="reveal"><span>Step Inside</span></a>
                </div>
                <div class="door left-door">
                    <div class="stud-column">
                        <div class="stud"></div>
                        <div class="stud"></div>
                        <div class="stud"></div>
                        <div class="stud"></div>
                    </div>
                    <div class="panel-container">
                        <div class="panel"></div>
                        <div class="panel"></div>
                        <div class="panel"></div>
                        <div class="panel"></div>
                    </div>
                    <div class="handle-container">
                        <div class="door-knob"></div>
                        <div class="handle-bar"></div>
                    </div>
                </div>
                <div class="door right-door">
                    <div class="handle-container">
                        <div class="door-knob"></div>
                        <div class="handle-bar"></div>
                    </div>
                    <div class="panel-container">
                        <div class="panel"></div>
                        <div class="panel"></div>
                        <div class="panel"></div>
                        <div class="panel"></div>
                    </div>
                    <div class="stud-column">
                        <div class="stud"></div>
                        <div class="stud"></div>
                        <div class="stud"></div>
                        <div class="stud"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
